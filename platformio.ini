; ЛР 6.1 — Конечный автомат Button-LED (Arduino Uno)
[platformio]
default_envs = uno

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 9600
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4
build_flags = -Wall

; Модульные тесты логики на ПК: pio test -e native
[env:native]
platform = native
test_build_src = no
build_flags = -std=gnu++11
lib_ignore = Button, Led, LcdDisplay, SerialStdio
